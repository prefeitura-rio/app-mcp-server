---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mcp
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  # `replicas` fica fora do spec pelo mesmo motivo do prod: o HPA abaixo
  # mira este Rollout via `/scale` e fixar um valor aqui entraria em
  # conflito com o autoscaler a cada sync do ArgoCD. `previewReplicaCount`
  # abaixo continua fixo — o HPA só controla a ReplicaSet ativa/estável do
  # blue-green (comportamento documentado do Argo Rollouts).
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp
  strategy:
    blueGreen:
      activeService: mcp
      previewService: mcp-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      previewReplicaCount: 1
  template:
    metadata:
      labels:
        app: mcp
    spec:
      # Mesmo racional de espalhamento do prod (ver k8s/prod/resources.yaml):
      # soft constraint porque o node pool compartilhado autoescala com piso
      # de 3 nós entre 4 zonas.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mcp
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mcp
      # Mesmo racional do prod: o shutdown lifespan de `src/app.py` não roda
      # em SIGTERM, então o preStop é quem dá tempo de o Endpoint/mesh parar
      # de rotear tráfego novo para o pod antes do sinal chegar ao processo.
      terminationGracePeriodSeconds: 30
      containers:
        - name: mcp
          image: ghcr.io/prefeitura-rio/app-mcp-server:eef9fd15a4e84d4b525cf85e4e8eaa112f17a566@sha256:e7477a2e4d34717d701515dcd17b3e7a3c9b782eb7f18f6513427cf640ce5649  # Updated by deploy-staging workflow
          ports:
            - containerPort: 80
          env:
            - name: OTEL_SERVICE_NAME
              value: "app-mcp-server"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            - name: MCP_STATELESS_HTTP
              value: "true"
          envFrom:
            - secretRef:
                name: mcp-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          # Cobre a inicialização, que carrega langgraph/geopandas/pandas e
          # roda o preflight de configuração. Enquanto não passar, liveness e
          # readiness ficam suspensos: um boot lento deixa de ser confundido
          # com um processo travado.
          startupProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30  # até 150s para subir
          # Liveness aponta para o endpoint trivial de propósito: ele não
          # consulta dependência alguma. Se checasse Redis ou BigQuery, uma
          # queda dessas dependências faria o kubelet matar o pod.
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # Readiness (Task 7 do plano de resiliência do MCP): inicialização
          # concluída E Redis alcançável dentro de um teto curto (2s, ver
          # `src/health/state.py::READINESS_REDIS_TIMEOUT_S`) — nunca
          # dependência de exportação de telemetria/coletor OTel. Mesmo
          # racional do prod (ver `k8s/prod/resources.yaml`): com o HPA/PDB
          # abaixo (mínimo de 2 réplicas, PDB permitindo perder 1), tirar SÓ
          # o pod sem Redis do Service é o comportamento correto. Falha:
          # `failureThreshold: 3` × `periodSeconds: 30` (~90s) marca o pod
          # NotReady sem reiniciá-lo; o próximo sucesso religa o pod ao
          # Service assim que o Redis volta.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-hpa
  labels:
    app: mcp
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: mcp
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-preview
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
