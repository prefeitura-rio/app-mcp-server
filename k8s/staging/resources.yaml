---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mcp
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp
  strategy:
    blueGreen:
      activeService: mcp
      previewService: mcp-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      previewReplicaCount: 1
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          image: ghcr.io/prefeitura-rio/app-mcp-server:486aa6e9cd3ed4b85707669086f9d25fa475643b@sha256:dee8308a0c258458585a127dc297d8b7cf0d50e79771fd58c73059115cd0e82a  # Updated by deploy-staging workflow
          ports:
            - containerPort: 80
          env:
            - name: OTEL_SERVICE_NAME
              value: "app-mcp-server"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            - name: MCP_STATELESS_HTTP
              value: "true"
          envFrom:
            - secretRef:
                name: mcp-secrets
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-preview
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
