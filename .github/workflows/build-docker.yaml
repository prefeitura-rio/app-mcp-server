name: Build Docker image

on:
  push:
    branches:
      - main

# Sem este bloco o GITHUB_TOKEN vem com write-all (CKV2_GHA_1). O workflow só
# lê o código e publica a imagem, então é isso que ele recebe.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Extract metadata for Docker tags
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/app-mcp-server"
          COMMIT_HASH=${{ github.sha }}
          TAGS="stable,latest,$COMMIT_HASH"

          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "TAGS=$TAGS" >> $GITHUB_ENV

      - name: Build and tag Docker image
        run: |
          for TAG in $(echo $TAGS | tr "," "\n"); do
            docker build -t $IMAGE_NAME:$TAG .
          done

      - name: Push Docker image
        run: |
          for TAG in $(echo $TAGS | tr "," "\n"); do
            docker push $IMAGE_NAME:$TAG
          done
