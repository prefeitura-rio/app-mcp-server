name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  # Fonte única da verdade do piso de cobertura. Antes o valor estava
  # duplicado entre o script do gate e o comentário de resumo, e os dois
  # saíram de sincronia: o gate exigia 75% enquanto o comentário reportava
  # 50% e calculava o status contra esse número — podia dizer "Passed" com o
  # job de teste vermelho.
  #
  # 62,0 é medido contra código de produção apenas. Os 75,0 anteriores eram
  # calibrados sobre um denominador que incluía a própria suíte de testes;
  # ver docs/decisions/CHATR-105-debitos-tecnicos.md.
  COVERAGE_MINIMUM: "62.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect lint targets
        id: detect
        run: |
          if [ -f Dockerfile ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run hadolint (Dockerfile)
        if: steps.detect.outputs.has_dockerfile == 'true'
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff lint
        run: uvx ruff@0.15.5 check .

      - name: Run Ruff format check
        run: uvx ruff@0.15.5 format --check .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy filesystem scan (SARIF)
        run: trivy fs --format sarif --output trivy-fs.sarif --severity HIGH,CRITICAL .

      - name: Upload Trivy FS SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  test:
    name: Tests + Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      baseline: ${{ steps.coverage.outputs.baseline }}
      delta: ${{ steps.coverage.outputs.delta }}
      minimum: ${{ steps.coverage.outputs.minimum }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Load shared CI environment
        # Lista única para os jobs `test` e `build` — ver .github/ci.env.
        # Comentários e linhas em branco são filtrados: o parser do
        # GITHUB_ENV só aceita `KEY=VALUE`.
        run: grep -Ev '^\s*(#|$)' .github/ci.env >> "$GITHUB_ENV"

      - name: Run tests with coverage
        env:
          # Específicas deste job; o restante vem do passo acima.
          # Os services do runner respondem em localhost, e o pytest não
          # executa o preflight — daí o placeholder de credencial bastar
          # aqui, mas não no container (ver job `build`).
          REDIS_URL: redis://localhost:6379/0
          MONGODB_URL: mongodb://localhost:27017
          DATA_DIR: /tmp
          GCP_SERVICE_ACCOUNT_CREDENTIALS: e30=
        run: uv run pytest --junitxml=pytest.xml --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload pytest report artifact
        if: always() && hashFiles('pytest.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-report
          path: pytest.xml

      - name: Coverage baseline gate (tolerance 0.1%)
        id: coverage
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          tolerance = 0.1
          minimum_coverage = float(os.environ["COVERAGE_MINIMUM"])
          baseline_path = ".github/coverage-baseline.json"
          xml_path = "coverage.xml"

          tree = ET.parse(xml_path)
          root = tree.getroot()
          current = float(root.attrib["line-rate"]) * 100.0

          with open(baseline_path, "r", encoding="utf-8") as f:
              baseline = float(json.load(f)["total"])

          delta = current - baseline

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"coverage={current:.2f}\n")
              out.write(f"baseline={baseline:.2f}\n")
              out.write(f"delta={delta:.2f}\n")
              out.write(f"minimum={minimum_coverage:.2f}\n")

          print(f"Current coverage: {current:.2f}%")
          print(f"Baseline coverage: {baseline:.2f}%")
          print(f"Minimum required coverage: {minimum_coverage:.2f}%")
          print(f"Delta: {delta:.2f} pp")

          if current < minimum_coverage:
              raise SystemExit(
                  f"Coverage is {current:.2f}%, below the minimum required threshold of {minimum_coverage:.1f}%."
              )

          if delta < -tolerance:
              raise SystemExit(
                  f"Coverage dropped by {-delta:.2f} pp, exceeding tolerance of {tolerance:.1f} pp."
              )
          PY

      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build + Image Scan + Smoke HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HURL_VERSION: "8.0.1"
    needs:
      - lint
      - security-scan
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Build image (dry-run, local only)
        run: docker buildx build --load -t app-mcp-server:pr-${{ github.sha }} .

      - name: Run Trivy image scan (SARIF)
        run: trivy image --format sarif --output trivy-image.sarif --severity HIGH,CRITICAL app-mcp-server:pr-${{ github.sha }}

      - name: Upload Trivy image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # ===== SMOKE HTTP CONTRA A IMAGEM (CHATR-165) =====
      # Até aqui a imagem era construída, escaneada e descartada sem nunca ser
      # executada: nada no gate verificava que o artefato que vai para o
      # cluster sobe e fala HTTP. Roda neste job, e não em um separado, porque
      # a imagem já está carregada aqui — passá-la adiante custaria um
      # artifact de centenas de MB.

      - name: Install Hurl
        run: |
          curl -fsSL -o /tmp/hurl.deb \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/hurl.deb
          hurl --version

      - name: Start container under test
        run: |
          # O preflight recusa service account malformada e aborta o boot,
          # então o placeholder `e30=` do job de testes não serve aqui. A
          # chave é gerada no runner e vive o tempo do job: versionar uma
          # chave privada, ainda que falsa, faria o Trivy e o SAST apontarem
          # credencial no repositório. Não corresponde a conta alguma no GCP.
          openssl genrsa -out /tmp/fake-sa.pem 2048 2>/dev/null

          python3 - > /tmp/fake-sa.b64 <<'PY'
          import base64, json

          key = open("/tmp/fake-sa.pem").read()
          # O campo `type`, de valor `service_account`, foi omitido de
          # propósito: `from_service_account_info()` exige apenas
          # client_email, token_uri e private_key, e escrever aquele par
          # chave/valor aqui dispara a regra `gcp-service-account` do Trivy,
          # que casa o literal e reporta vazamento CRITICAL. É falso positivo
          # — a chave é gerada no runner, logo acima — mas ficaria aberto no
          # code scanning a cada scan da main. Suprimir via `.trivyignore`
          # sairia caro: o ignore é por ID de regra e cegaria o scanner para
          # uma service account de verdade commitada em qualquer lugar do
          # repositório. Escrever o par nem em comentário: a regra casa o
          # literal onde quer que ele apareça, comentário inclusive.
          info = {
              "project_id": "ci-smoke",
              "private_key_id": "ci",
              "private_key": key,
              "client_email": "ci-smoke@example.invalid",
              "client_id": "0",
              "token_uri": "https://oauth2.googleapis.com/token",
          }
          print(base64.b64encode(json.dumps(info).encode()).decode(), end="")
          PY

          # Redis e MongoDB apontam para portas inalcançáveis de dentro do
          # container de propósito: a suíte confirma que /health e
          # /health/ready continuam 200 com dependência crítica fora do ar.
          # Nenhum service precisa subir para este job.
          docker run -d --name mcp-smoke -p 8080:80 \
            --env-file .github/ci.env \
            -e GCP_SERVICE_ACCOUNT_CREDENTIALS="$(cat /tmp/fake-sa.b64)" \
            -e DATA_DIR=/app/data \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e MONGODB_URL=mongodb://127.0.0.1:27017 \
            app-mcp-server:pr-${{ github.sha }}

      - name: Wait for container to serve /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "Container respondendo apos ${i} tentativa(s)."
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=mcp-smoke)" ]; then
              echo "Container morreu antes de atender - provavel falha de preflight:"
              docker logs mcp-smoke
              exit 1
            fi
            sleep 5
          done

          echo "Container nao atendeu /health dentro do tempo limite."
          docker logs mcp-smoke
          exit 1

      - name: Run Hurl smoke suite
        # `--test` e obrigatorio: sem ele o Hurl imprime o corpo e sai com 0
        # mesmo com assert falhando, e o gate passaria verde a toa.
        run: |
          hurl --test \
            --variable base_url=http://127.0.0.1:8080 \
            --variable token=test-token \
            --report-html src/tests/hurl/store/report \
            src/tests/hurl/smoke.hurl

      - name: Upload Hurl report artifact
        if: always() && hashFiles('src/tests/hurl/store/report/index.html') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hurl-report
          path: src/tests/hurl/store/report

      - name: Dump container logs on failure
        if: failure()
        run: docker logs mcp-smoke || true

      - name: Stop container under test
        if: always()
        run: docker rm -f mcp-smoke || true

  pr-summary:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && github.event_name == 'pull_request'
    needs:
      - lint
      - security-scan
      - test
      - build

    steps:
      - name: Create or update PR summary comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        # Valores passam por `env`, não por interpolação `${{ }}` dentro do
        # corpo do script: `toJSON` de uma string embute aspas literais, então
        # `Number('"80.04"')` dava NaN e o status saía sempre "Unknown". Ler de
        # `process.env` também elimina a superfície de injeção no script.
        env:
          COVERAGE_CURRENT: ${{ needs.test.outputs.coverage }}
          COVERAGE_BASELINE: ${{ needs.test.outputs.baseline }}
          COVERAGE_DELTA: ${{ needs.test.outputs.delta }}
          COVERAGE_MINIMUM: ${{ needs.test.outputs.minimum }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_SECURITY: ${{ needs['security-scan'].result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_BUILD: ${{ needs.build.result }}
        with:
          script: |
            const formatStatus = (result) => {
              if (result === "success") return "Passed";
              if (result === "failure") return "Failed";
              if (result === "cancelled") return "Cancelled";
              if (result === "skipped") return "Skipped";
              return result || "Unknown";
            };

            const coverageCurrent = process.env.COVERAGE_CURRENT || "";
            const coverageBaseline = process.env.COVERAGE_BASELINE || "";
            const coverageDelta = process.env.COVERAGE_DELTA || "";
            const coverageMinimum = process.env.COVERAGE_MINIMUM || "";

            const formatCoverageDelta = (delta) => {
              const numeric = Number(delta);
              if (Number.isNaN(numeric)) return delta;
              const signal = numeric >= 0 ? "+" : "";
              return `${signal}${numeric.toFixed(2)}`;
            };

            const coverageStatus = (current, baseline, minimum) => {
              const currentNumber = Number(current);
              const baselineNumber = Number(baseline);
              const minimumNumber = Number(minimum);
              if ([currentNumber, baselineNumber, minimumNumber].some(Number.isNaN)) {
                return "Unknown";
              }
              if (currentNumber < minimumNumber) return "Failed";
              if (currentNumber + 0.1 < baselineNumber) return "Failed";
              return "Passed";
            };

            const hasCoverage = [
              coverageCurrent,
              coverageBaseline,
              coverageDelta,
              coverageMinimum,
            ].every((v) => v !== "" && v !== "null" && !Number.isNaN(Number(v)));

            const coverageBlock = hasCoverage
              ? [
                  "### 📊 Coverage",
                  `- Current: \`${coverageCurrent}%\``,
                  `- Baseline: \`${coverageBaseline}%\``,
                  `- Minimum: \`${coverageMinimum}%\``,
                  `- Delta: \`${formatCoverageDelta(coverageDelta)} pp\``,
                  `- Status: **${coverageStatus(coverageCurrent, coverageBaseline, coverageMinimum)}**`,
                ].join("\n")
              : [
                  "### 📊 Coverage",
                  "- Coverage data was not produced for this run.",
                ].join("\n");

            const results = {
              lint: process.env.RESULT_LINT,
              security: process.env.RESULT_SECURITY,
              test: process.env.RESULT_TEST,
              build: process.env.RESULT_BUILD,
            };

            const allPassed = Object.values(results).every((r) => r === "success");

            const marker = "<!-- pr-quality-gate-summary -->";
            const body = `${marker}
            ## 🚦 PR Quality Gate Summary

            | Check | Result |
            |---|---|
            | Lint | ${formatStatus(results.lint)} |
            | Security Scan | ${formatStatus(results.security)} |
            | Tests + Coverage | ${formatStatus(results.test)} |
            | Build + Scan + Smoke | ${formatStatus(results.build)} |

            ${coverageBlock}

            ---

            ${allPassed
              ? "### ✅ All quality checks passed"
              : "### ❌ Quality gate failed"}
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const previous = comments.find(
              (c) => c.user.type === "Bot" && c.body && c.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
