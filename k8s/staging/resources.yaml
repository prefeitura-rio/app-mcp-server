---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mcp
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp
  strategy:
    blueGreen:
      activeService: mcp
      previewService: mcp-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      previewReplicaCount: 1
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          image: ghcr.io/prefeitura-rio/app-mcp-server:9e339be2e3bbbb02528b77b7a04679e697f6f73d@sha256:d97f70a69cf8c9df338dee86c97b63e8a1c74ead024fce413e9e7962161a9847  # Updated by deploy-staging workflow
          ports:
            - containerPort: 80
          env:
            - name: OTEL_SERVICE_NAME
              value: "app-mcp-server"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            - name: MCP_STATELESS_HTTP
              value: "true"
          envFrom:
            - secretRef:
                name: mcp-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-preview
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
