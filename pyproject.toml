[project]
name = "app-mcp-server"
version = "1.0.0"
description = "Servidor FastMCP para o Rio de Janeiro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "pytz",
    "fastmcp>=2.14.7,<3",
    "loguru>=0.7.3",
    "fastapi>=0.115.14",
    "aiohttp>=3.13.3",
    "python-dotenv>=1.0.0",
    "google-genai>=1.25.0",
    "google-cloud-storage>=2.18,<3",
    "google-cloud-bigquery>=3.35.0",
    "pydantic>=2.11.7",
    "redis>=7.0.1",
    "langgraph==0.6.4",
    "httpx>=0.27.0",
    "langchain-core==0.3.86",
    "langchain-mcp-adapters>=0.1.9",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "opentelemetry-instrumentation-asgi>=0.57b0",
    "opentelemetry-sdk>=1.36.0",
    "pandas>=2.3.3",
    "async-googlemaps>=0.0.10",
    # `async_googlemaps` importa `googlemaps` em runtime mas não o declara
    # no próprio metadata; sem esta linha o import quebra na coleta.
    "googlemaps>=4.10.0",
    # Declaradas explicitamente: são usadas em produção mas antes chegavam
    # de carona (shapely via geopandas, cryptography via pyjwt[crypto],
    # aiofiles via crawl4ai). Sem isto, remover aquelas quebra o build.
    "shapely>=2.1",
    "cryptography>=50",
    "aiofiles>=24.1",
    "jellyfish>=1.2.1",
    "num2words>=0.5.14",
    "prefeitura-rio>=1.1.2",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
# `testpaths` evita que o pytest varra a árvore inteira à procura de `test_*.py`
# e acabe importando código de aplicação por acidente (foi o caso de
# `src/utils/test_agent.py`, removido em CHATR-105).
testpaths = ["src/tests"]
# `strict` exige `@pytest.mark.asyncio` explícito: um teste async sem a marca
# falha em vez de passar sem nunca ter rodado.
asyncio_mode = "strict"
addopts = "--strict-markers --strict-config"
# Silencia só o ruído conhecido de terceiros. Um `ignore::DeprecationWarning`
# amplo esconderia avisos de quebra futura nas nossas próprias dependências.
filterwarnings = [
    "ignore:authlib.jose module is deprecated:DeprecationWarning",
    "ignore:The default value of `allowed_objects` will change:PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = false
# A própria suíte fora do denominador: cobertura deve medir código de produção.
omit = [
    "src/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
