---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mcp
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp
  strategy:
    canary:
      stableService: mcp
      canaryService: mcp-canary
      maxSurge: 1
      maxUnavailable: 0
      abortScaleDownDelaySeconds: 30
      steps:
        - setWeight: 25
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 10m
        - setWeight: 100
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          image: ghcr.io/prefeitura-rio/app-mcp-server:v2026.08.31-1@sha256:83b5affab87ea1057b601308eb1d04408c2f7e6ff2bea1c047c18c57c14304a0  # Updated by release workflow
          ports:
            - containerPort: 80
          env:
            - name: OTEL_SERVICE_NAME
              value: "app-mcp-server"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            # Vira `k8s.pod.name` no Resource do OTel (ver
            # src/observability/tracing.py). Sem ele não há como atribuir
            # um pico de latência ou uma rajada de erro a uma réplica.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MCP_STATELESS_HTTP
              value: "true"
          envFrom:
            - secretRef:
                name: mcp-secrets
          securityContext:
            # Hardening que não depende do usuário da imagem — por isso entra
            # agora, enquanto o `runAsNonRoot` espera um build testado (ver
            # abaixo). Nenhum deles altera comportamento de aplicação web em
            # Python: o processo não escala privilégio, não usa capability de
            # kernel e não precisa de syscall fora do perfil padrão.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            # runAsNonRoot: true
            #   PENDENTE, e o bloqueio nao e o que parece. `USER 10001` no
            #   Dockerfile mais `COPY --chown` resolve a imagem e o DATA_DIR;
            #   isso foi implementado e verificado (build, uid 10001, escrita
            #   em DATA_DIR/bq_dlq, hurl 100%) e revertido depois.
            #
            #   O que trava e a porta. Sem CAP_NET_BIND_SERVICE -- que o
            #   `capabilities.drop: [ALL]` acima remove -- nao ha bind abaixo
            #   de 1024, entao runAsNonRoot obriga a sair da porta 80. E o
            #   `mcp-ilb` (modules/deployments/mcp.tf, no iac-superapp) tem
            #   `target_port = 80` fixo e seleciona estes pods direto, sem
            #   passar pelo Service: mudar a porta aqui derruba o agent-engine
            #   ate um `terraform apply` correspondente. Depende de um par de
            #   mudancas coordenadas, fora deste repositorio.
            #
            #   Armadilha ao retomar: o Docker seta
            #   `net.ipv4.ip_unprivileged_port_start=0` e o Kubernetes nao, o
            #   que faz a porta 80 ligar como nao-root numa prova local e
            #   falhar no cluster. Reproduza a regra do cluster com
            #   `--sysctl net.ipv4.ip_unprivileged_port_start=1024`.
            # readOnlyRootFilesystem: true
            #   NÃO aplicar como está: o app escreve em DATA_DIR/bq_dlq/ e o
            #   `JsonBackend` faz mkdir + write. Exigiria montar um emptyDir
            #   nesses caminhos primeiro.
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1536Mi"
          # Cobre a inicialização, que carrega langgraph/geopandas/pandas e
          # roda o preflight de configuração. Enquanto não passar, liveness e
          # readiness ficam suspensos: um boot lento deixa de ser confundido
          # com um processo travado.
          startupProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30  # até 150s para subir
          # Liveness aponta para o endpoint trivial de propósito: ele não
          # consulta dependência alguma. Se checasse Redis ou BigQuery, uma
          # queda dessas dependências faria o kubelet matar o pod — e, com
          # replicas: 1, converteria degradação parcial em outage total.
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # Readiness reflete "inicialização concluída" — também sem depender
          # de serviços externos. O estado das dependências fica em
          # /health/detail, que nunca retorna 503. Apontar para uma rota
          # própria desacopla as duas semânticas: verificações acrescentadas
          # ao readiness no futuro não poderão matar o pod.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      # Orçamento de encerramento, explícito porque o flush do buffer de escrita
      # do BigQuery depende dele. Em SIGTERM, `src/utils/bigquery.py` drena o
      # buffer de forma síncrona com teto de BIGQUERY_SHUTDOWN_TIMEOUT_SECONDS
      # (5s) por chamada de insert, uma por tabela em buffer. Estourar este
      # prazo significa SIGKILL no meio do flush — e aí não sobra nem a DLQ,
      # que é justamente a rede que o CHATR-103 construiu.
      #
      # 60s dá folga sobre o pior caso observável (4 tabelas x 5s = 20s) sem
      # atrasar rollout de forma perceptível: o pod sai assim que termina, o
      # valor é teto e não espera.
      terminationGracePeriodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-canary
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
