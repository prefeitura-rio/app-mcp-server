name: Update Tool Version

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tool_version.json'

jobs:
  update-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Commit and push version update
        run: |
          # Grava a versão sobre a ponta atual da main e refaz o push com fetch
          # novo quando a main anda antes dele; falha se nenhuma tentativa
          # entrar (DEV-641).
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          bash scripts/ci/commit_tool_version.sh
