---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mcp
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  # `replicas` fica fora do spec pelo mesmo motivo do prod: o HPA abaixo
  # mira este Rollout via `/scale` e fixar um valor aqui entraria em
  # conflito com o autoscaler a cada sync do ArgoCD. `previewReplicaCount`
  # abaixo continua fixo — o HPA só controla a ReplicaSet ativa/estável do
  # blue-green (comportamento documentado do Argo Rollouts).
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp
  strategy:
    blueGreen:
      activeService: mcp
      previewService: mcp-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      previewReplicaCount: 1
  template:
    metadata:
      labels:
        app: mcp
    spec:
      # Mesmo racional de espalhamento do prod (ver k8s/prod/resources.yaml):
      # soft constraint porque o node pool compartilhado autoescala com piso
      # de 3 nós entre 4 zonas.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mcp
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mcp
      containers:
        - name: mcp
          image: ghcr.io/prefeitura-rio/app-mcp-server:eef9fd15a4e84d4b525cf85e4e8eaa112f17a566@sha256:e7477a2e4d34717d701515dcd17b3e7a3c9b782eb7f18f6513427cf640ce5649  # Updated by deploy-staging workflow
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: "app-mcp-server"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            # Vira `k8s.pod.name` no Resource do OTel (ver
            # src/observability/tracing.py). Sem ele não há como atribuir
            # um pico de latência ou uma rajada de erro a uma réplica.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MCP_STATELESS_HTTP
              value: "true"
          envFrom:
            - secretRef:
                name: mcp-secrets
          securityContext:
            # Nenhum destes altera comportamento de aplicação web em Python: o
            # processo não escala privilégio, não usa capability de kernel e não
            # precisa de syscall fora do perfil padrão.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            # UID/GID numéricos, batendo com o `USER 10001:10001` do Dockerfile.
            # Repetidos aqui de propósito: sem `runAsUser` explícito o kubelet
            # teria de resolver o usuário da imagem para decidir se é root, e
            # recusa o pod quando não consegue.
            #
            # É isto que obriga a porta 8080. O `drop: [ALL]` acima remove o
            # CAP_NET_BIND_SERVICE e o `allowPrivilegeEscalation: false` liga o
            # `no_new_privs`, que impede recuperá-lo por file capability
            # (`setcap`): processo não-root não liga abaixo de 1024 nem com
            # `capabilities.add`. O `Service` continua publicando a porta 80 — o
            # que muda é o `targetPort`.
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            # Raiz somente leitura. Os dois caminhos que o processo escreve em
            # runtime chegam por emptyDir (ver `volumes`):
            #
            #   /app/data/bq_dlq  fallback em arquivo da DLQ do BigQuery,
            #                     acionado quando o Redis está fora. Montado
            #                     no caminho exato do subdiretório, e não em
            #                     `/app/data`: aquele guarda bairros.json e
            #                     logradouros.json, que vêm da imagem e
            #                     sumiriam debaixo de um emptyDir.
            #   /tmp              rascunho de bibliotecas; é para onde o
            #                     Dockerfile aponta o `HOME`, já que o
            #                     usuário 10001 não tem home na imagem.
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: bq-dlq
              mountPath: /app/data/bq_dlq
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          # Cobre a inicialização, que carrega langgraph/geopandas/pandas e
          # roda o preflight de configuração. Enquanto não passar, liveness e
          # readiness ficam suspensos: um boot lento deixa de ser confundido
          # com um processo travado.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30  # até 150s para subir
          # Liveness aponta para o endpoint trivial de propósito: ele não
          # consulta dependência alguma. Se checasse Redis ou BigQuery, uma
          # queda dessas dependências faria o kubelet matar o pod.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # Readiness (Task 7 do plano de resiliência do MCP): inicialização
          # concluída E Redis alcançável dentro de um teto curto (2s, ver
          # `src/health/state.py::READINESS_REDIS_TIMEOUT_S`) — nunca
          # dependência de exportação de telemetria/coletor OTel. Mesmo
          # racional do prod (ver `k8s/prod/resources.yaml`): com o HPA/PDB
          # abaixo (mínimo de 2 réplicas, PDB permitindo perder 1), tirar SÓ
          # o pod sem Redis do Service é o comportamento correto. Falha:
          # `failureThreshold: 3` × `periodSeconds: 30` (~90s) marca o pod
          # NotReady sem reiniciá-lo; o próximo sucesso religa o pod ao
          # Service assim que o Redis volta.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      # `fsGroup` é o que torna os emptyDir graváveis pelo uid 10001: o kubelet
      # aplica o grupo ao volume no momento da montagem. Sem ele os dois chegam
      # root:root 0755 e o processo não-root só lê — a DLQ falharia calada, e só
      # no dia em que o Redis caísse.
      securityContext:
        fsGroup: 10001
      volumes:
        # Efêmero de propósito, como já era: o fallback da DLQ vale dentro da
        # vida do pod (o worker de drain o reprocessa), não como armazenamento
        # durável. Durabilidade exigiria PVC, que é outra decisão.
        - name: bq-dlq
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      # Orçamento de encerramento único para todo o ciclo de shutdown do pod
      # (mesmo racional do prod, ver `k8s/prod/resources.yaml`): o shutdown
      # lifespan de `src/app.py` não roda em SIGTERM, então o `preStop: sleep
      # 10` do container acima é quem dá tempo de o Endpoint/mesh parar de
      # rotear tráfego novo para o pod antes do sinal chegar ao processo.
      # Depois do SIGTERM, `src/utils/bigquery.py` drena o buffer de escrita
      # de forma síncrona com teto de BIGQUERY_SHUTDOWN_TIMEOUT_SECONDS (5s)
      # por chamada de insert, uma por tabela em buffer — estourar o grace
      # period significa SIGKILL no meio do flush e perder a rede da DLQ que
      # o CHATR-103 construiu. 60s cobre os dois: 10s de preStop + até 20s de
      # flush (pior caso observável) com folga.
      terminationGracePeriodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-hpa
  labels:
    app: mcp
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: mcp
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-preview
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
