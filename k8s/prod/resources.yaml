---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mcp
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  # `replicas` fica de propósito fora do spec: com o HPA abaixo mirando este
  # Rollout via seu subresource `/scale` (suportado nativamente pelo Argo
  # Rollouts, como em todo Deployment), fixar um valor aqui entraria em
  # conflito com o autoscaler a cada sync do ArgoCD — mesma convenção já
  # usada por `identidade-carioca-authz` e `cerbos-ext-authz` neste
  # workspace. O piso de capacidade em produção é o `minReplicas` do HPA.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp
  strategy:
    canary:
      stableService: mcp
      canaryService: mcp-canary
      maxSurge: 1
      maxUnavailable: 0
      abortScaleDownDelaySeconds: 30
      # Análise em background: começa depois do primeiro degrau (25% +
      # 5min de soak) e mede taxa de sucesso/erro do tráfego que chega em
      # `mcp-canary` via o AnalysisTemplate abaixo. Qualquer métrica que
      # violar seu `failureLimit` aborta o rollout e reverte automaticamente
      # para a versão estável — comportamento nativo do Argo Rollouts,
      # documentado em docs/features/analysis.md e
      # docs/features/scaledown-aborted-rs.md ("the basic canary strategy
      # always rolls back to the stable version upon an abort").
      analysis:
        templates:
          - templateName: mcp-success-rate
        startingStep: 2
        args:
          - name: service-name
            value: mcp-canary
      steps:
        - setWeight: 25
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 10m
        - setWeight: 100
  template:
    metadata:
      labels:
        app: mcp
    spec:
      # Espalha os pods entre zonas e hosts diferentes para que a perda de
      # uma zona ou de um nó não derrube a maioria das réplicas de uma vez.
      # `ScheduleAnyway` (soft) em vez de `DoNotSchedule`: o node pool
      # (`pods-pool`) autoescala com piso de 3 nós entre 4 zonas
      # (infra/superapp `modules/gke/main.tf`), então uma regra rígida
      # poderia deixar pods `Pending` em picos de reagendamento.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mcp
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mcp
      containers:
        - name: mcp
          image: ghcr.io/prefeitura-rio/app-mcp-server:v2026.07.23-1@sha256:5aff79a1485e4b1759c536970959189d47d7924731064d58ba193c2d4d6f0f37  # Updated by release workflow
          ports:
            - containerPort: 80
          env:
            - name: OTEL_SERVICE_NAME
              value: "app-mcp-server"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            # Vira `k8s.pod.name` no Resource do OTel (ver
            # src/observability/tracing.py). Sem ele não há como atribuir
            # um pico de latência ou uma rajada de erro a uma réplica.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MCP_STATELESS_HTTP
              value: "true"
          envFrom:
            - secretRef:
                name: mcp-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          # Cobre a inicialização, que carrega langgraph/geopandas/pandas e
          # roda o preflight de configuração. Enquanto não passar, liveness e
          # readiness ficam suspensos: um boot lento deixa de ser confundido
          # com um processo travado.
          startupProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30  # até 150s para subir
          # Liveness aponta para o endpoint trivial de propósito: ele não
          # consulta dependência alguma. Se checasse Redis ou BigQuery, uma
          # queda dessas dependências faria o kubelet matar o pod. Com
          # múltiplas réplicas espalhadas por zona/host e PDB/HPA abaixo,
          # essa degradação já não é mais capaz de virar outage total, mas o
          # desacoplamento liveness/dependências continua correto por si só.
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # Readiness (Task 7 do plano de resiliência do MCP): inicialização
          # concluída E Redis alcançável dentro de um teto curto (2s, ver
          # `src/health/state.py::READINESS_REDIS_TIMEOUT_S`) — nunca
          # dependência de exportação de telemetria/coletor OTel. Até a
          # Task 4 este probe era cego a dependências de propósito
          # (produção rodava `replicas: 1`, e tirar o único pod do
          # balanceador por causa do Redis convertia degradação parcial em
          # outage total). Com o HPA/PDB abaixo (mínimo de 3 réplicas, PDB
          # permitindo perder 1), o comportamento correto passou a ser
          # tirar SÓ o pod sem Redis do Service e deixar as réplicas
          # saudáveis absorverem o tráfego. Falha: `failureThreshold: 3` ×
          # `periodSeconds: 30` (~90s) marca o pod NotReady, removendo-o do
          # Endpoint sem reiniciá-lo — `startupProbe`/`livenessProbe` continuam
          # de pé, então quando o Redis volta o próximo sucesso já religa o
          # pod ao Service, sem esperar por um novo rollout.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      # Orçamento de encerramento único para todo o ciclo de shutdown do pod.
      # `src/app.py::health_lifespan` documenta que seu bloco de shutdown NÃO
      # roda em SIGTERM (a uvicorn restaura o handler padrão do sinal antes do
      # lifespan do FastMCP desenrolar) — quem tira o pod do balanceador é o
      # próprio Kubernetes, ao marcá-lo Terminating. O `preStop: sleep 10`
      # do container abaixo dá tempo para a propagação do Endpoint/mesh
      # (kube-proxy, Istio EDS) convergir e parar de mandar tráfego novo para
      # este pod antes do SIGTERM efetivamente chegar ao processo.
      #
      # Depois do SIGTERM, `src/utils/bigquery.py` drena o buffer de escrita
      # de forma síncrona com teto de BIGQUERY_SHUTDOWN_TIMEOUT_SECONDS (5s)
      # por chamada de insert, uma por tabela em buffer. Estourar o grace
      # period significa SIGKILL no meio do flush — e aí não sobra nem a DLQ,
      # que é justamente a rede que o CHATR-103 construiu.
      #
      # 60s cobre os dois: 10s de preStop + até 20s de flush (4 tabelas x 5s,
      # pior caso observável) com folga, sem atrasar rollout de forma
      # perceptível — o pod sai assim que termina, o valor é teto e não
      # espera.
      terminationGracePeriodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-hpa
  labels:
    app: mcp
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: mcp
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-pdb
spec:
  # minAvailable: 2 com HPA.minReplicas: 3 acima permite drenar/perder 1 pod
  # por vez (voluntary disruption) sem cair abaixo do piso de capacidade.
  minAvailable: 2
  selector:
    matchLabels:
      app: mcp

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-canary
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# AnalysisTemplate — sinal de sucesso/erro do canary, no mesmo formato usado
# por app-go-api/app-rmi/app-catalogo/portal-interno/superapp neste
# workspace (Prometheus + métricas Istio, com fallback `or vector(1)`/
# `or vector(0)` para quando `mcp-canary` recebe pouco ou nenhum tráfego
# real — este Rollout não usa `trafficRouting.istio`, então a divisão de
# peso entre estável/canário é aproximada pela contagem de réplicas, não
# por um VirtualService; adicionar traffic shaping via Istio ao MCP é uma
# mudança de infraestrutura fora do escopo desta tarefa).
# Endereço do Prometheus verificado contra o Service real definido em
# infra/superapp `modules/deployments/yamls/istio/prometheus.yaml`
# (`name: prometheus`, porta 9090) — não `prometheus-server`, hostname que
# alguns AnalysisTemplates irmãos usam mas que não corresponde a nenhum
# Service existente no cluster.
#
# Runbook (plan todo 8, comentário apenas — nenhum comportamento mudou
# aqui): docs/runbooks/failed-canary.md documenta a semântica exata de
# `failureLimit`/abort/rollback deste AnalysisTemplate e o drill isolado
# que a exercita (`src/tests/resilience/test_drill_failed_canary.py`).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: mcp-success-rate
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 1m
      successCondition: result[0] >= 0.95
      failureLimit: 5
      provider:
        prometheus:
          address: http://prometheus.istio-system.svc.cluster.local:9090
          query: |
            (sum(rate(istio_requests_total{destination_service_name=~"{{args.service-name}}",response_code!~"5.."}[2m])) or vector(0)) / (sum(rate(istio_requests_total{destination_service_name=~"{{args.service-name}}"}[2m])) > 0) or vector(1)
    - name: error-rate
      interval: 1m
      successCondition: result[0] <= 0.05
      failureLimit: 5
      provider:
        prometheus:
          address: http://prometheus.istio-system.svc.cluster.local:9090
          query: |
            (sum(rate(istio_requests_total{destination_service_name=~"{{args.service-name}}",response_code=~"5.."}[2m])) or vector(0)) / (sum(rate(istio_requests_total{destination_service_name=~"{{args.service-name}}"}[2m])) > 0) or vector(0)
