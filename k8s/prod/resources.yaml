---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mcp
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp
  strategy:
    canary:
      stableService: mcp
      canaryService: mcp-canary
      maxSurge: 1
      maxUnavailable: 0
      abortScaleDownDelaySeconds: 30
      steps:
        - setWeight: 25
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 10m
        - setWeight: 100
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          image: ghcr.io/prefeitura-rio/app-mcp-server:v2026.08.31-1@sha256:83b5affab87ea1057b601308eb1d04408c2f7e6ff2bea1c047c18c57c14304a0  # Updated by release workflow
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: "app-mcp-server"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            # Vira `k8s.pod.name` no Resource do OTel (ver
            # src/observability/tracing.py). Sem ele não há como atribuir
            # um pico de latência ou uma rajada de erro a uma réplica.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MCP_STATELESS_HTTP
              value: "true"
          envFrom:
            - secretRef:
                name: mcp-secrets
          securityContext:
            # Nenhum destes altera comportamento de aplicação web em Python: o
            # processo não escala privilégio, não usa capability de kernel e não
            # precisa de syscall fora do perfil padrão.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            # UID/GID numéricos, batendo com o `USER 10001:10001` do Dockerfile.
            # Repetidos aqui de propósito: sem `runAsUser` explícito o kubelet
            # teria de resolver o usuário da imagem para decidir se é root, e
            # recusa o pod quando não consegue.
            #
            # É isto que obriga a porta 8080. O `drop: [ALL]` acima remove o
            # CAP_NET_BIND_SERVICE e o `allowPrivilegeEscalation: false` liga o
            # `no_new_privs`, que impede recuperá-lo por file capability
            # (`setcap`): processo não-root não liga abaixo de 1024 nem com
            # `capabilities.add`. O `Service` continua publicando a porta 80 — o
            # que muda é o `targetPort`.
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            # Raiz somente leitura. Os dois caminhos que o processo escreve em
            # runtime chegam por emptyDir (ver `volumes`):
            #
            #   /app/data/bq_dlq  fallback em arquivo da DLQ do BigQuery,
            #                     acionado quando o Redis está fora. Montado
            #                     no caminho exato do subdiretório, e não em
            #                     `/app/data`: aquele guarda bairros.json e
            #                     logradouros.json, que vêm da imagem e
            #                     sumiriam debaixo de um emptyDir.
            #   /tmp              rascunho de bibliotecas; é para onde o
            #                     Dockerfile aponta o `HOME`, já que o
            #                     usuário 10001 não tem home na imagem.
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: bq-dlq
              mountPath: /app/data/bq_dlq
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1536Mi"
          # Cobre a inicialização, que carrega langgraph/geopandas/pandas e
          # roda o preflight de configuração. Enquanto não passar, liveness e
          # readiness ficam suspensos: um boot lento deixa de ser confundido
          # com um processo travado.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30  # até 150s para subir
          # Liveness aponta para o endpoint trivial de propósito: ele não
          # consulta dependência alguma. Se checasse Redis ou BigQuery, uma
          # queda dessas dependências faria o kubelet matar o pod — e, com
          # replicas: 1, converteria degradação parcial em outage total.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # Readiness reflete "inicialização concluída" — também sem depender
          # de serviços externos. O estado das dependências fica em
          # /health/detail, que nunca retorna 503. Apontar para uma rota
          # própria desacopla as duas semânticas: verificações acrescentadas
          # ao readiness no futuro não poderão matar o pod.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      # `fsGroup` é o que torna os emptyDir graváveis pelo uid 10001: o kubelet
      # aplica o grupo ao volume no momento da montagem. Sem ele os dois chegam
      # root:root 0755 e o processo não-root só lê — a DLQ falharia calada, e só
      # no dia em que o Redis caísse.
      securityContext:
        fsGroup: 10001
      volumes:
        # Efêmero de propósito, como já era: o fallback da DLQ vale dentro da
        # vida do pod (o worker de drain o reprocessa), não como armazenamento
        # durável. Durabilidade exigiria PVC, que é outra decisão.
        - name: bq-dlq
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      # Orçamento de encerramento, explícito porque o flush do buffer de escrita
      # do BigQuery depende dele. Em SIGTERM, `src/utils/bigquery.py` drena o
      # buffer de forma síncrona com teto de BIGQUERY_SHUTDOWN_TIMEOUT_SECONDS
      # (5s) por chamada de insert, uma por tabela em buffer. Estourar este
      # prazo significa SIGKILL no meio do flush — e aí não sobra nem a DLQ,
      # que é justamente a rede que o CHATR-103 construiu.
      #
      # 60s dá folga sobre o pior caso observável (4 tabelas x 5s = 20s) sem
      # atrasar rollout de forma perceptível: o pod sai assim que termina, o
      # valor é teto e não espera.
      terminationGracePeriodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-canary
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
