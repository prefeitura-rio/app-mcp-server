# Blacklist de domínios das fontes da tool `google_search` (CHATR-314).
#
# Fonte de um domínio listado aqui não chega ao cidadão: sai das citações e da
# lista de fontes da resposta. O texto que o Gemini escreveu a partir dela fica
# (não há `exclude_domains` no Gemini API); só o link é cortado.
#
# Onde é aplicada (src/tools/google_search/gemini_service.py):
# - no domínio de cada fonte do grounding, antes da resolução: a fonte
#   bloqueada nem é resolvida;
# - no host do `Location` devolvido pelo Google, depois da resolução;
# - nas citações e na lista de fontes da resposta.
#
# Como os domínios são comparados:
# - por domínio ou subdomínio: `facebook.com` pega `facebook.com` e
#   `m.facebook.com`, mas não `notfacebook.com`; `x.com` não pega `netflix.com`;
# - sem diferença de caixa, de ponto final ou de `www.` no início;
# - escreva só o domínio: sem `https://`, sem caminho.
#
# As seções existem só para organizar a revisão; todas valem igual.
#
# Substitui a variável de ambiente LINK_BLACKLIST, que comparava por trecho de
# texto e ficava no Infisical, fora de revisão. As 135 entradas de produção
# (26/10/2026) entraram como estavam, menos 7 que a comparação por subdomínio
# tornou redundantes: g1.globo.com, oglobo.globo.com e extra.globo.com (cobertos
# por globo.com), band.uol.com.br, bandnewstv.uol.com.br e redetv.uol.com.br
# (por uol.com.br) e record.r7.com (por r7.com).
#
# Toda mudança aqui passa por revisão em PR e vale igual em staging e produção.
# A lista é lida só na subida do pod: mudar exige uma nova versão da aplicação.

