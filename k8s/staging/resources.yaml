---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mcp
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp
  strategy:
    blueGreen:
      activeService: mcp
      previewService: mcp-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      previewReplicaCount: 1
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          image: ghcr.io/prefeitura-rio/app-mcp-server:eef9fd15a4e84d4b525cf85e4e8eaa112f17a566@sha256:e7477a2e4d34717d701515dcd17b3e7a3c9b782eb7f18f6513427cf640ce5649  # Updated by deploy-staging workflow
          ports:
            - containerPort: 80
          env:
            - name: OTEL_SERVICE_NAME
              value: "app-mcp-server"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            # Vira `k8s.pod.name` no Resource do OTel (ver
            # src/observability/tracing.py). Sem ele não há como atribuir
            # um pico de latência ou uma rajada de erro a uma réplica.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MCP_STATELESS_HTTP
              value: "true"
          envFrom:
            - secretRef:
                name: mcp-secrets
          securityContext:
            # Hardening que não depende do usuário da imagem — por isso entra
            # agora, enquanto o `runAsNonRoot` espera um build testado (ver
            # abaixo). Nenhum deles altera comportamento de aplicação web em
            # Python: o processo não escala privilégio, não usa capability de
            # kernel e não precisa de syscall fora do perfil padrão.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # O `drop: [ALL]` acima tira junto o CAP_NET_BIND_SERVICE, e o
              # bind em porta abaixo de 1024 e checado por capability, nao
              # por uid: sem esta linha o processo nao sobe na porta 80 nem
              # como root -- falha com `permission denied` no bind e o pod
              # entra em CrashLoopBackOff. O Kubernetes deixa
              # `net.ipv4.ip_unprivileged_port_start` no default 1024 do
              # kernel; o Docker seta 0, e e por isso que a prova local nao
              # acusa. Reproduza a regra do cluster com
              # `--sysctl net.ipv4.ip_unprivileged_port_start=1024`.
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
            # runAsNonRoot: true
            #   PENDENTE -- o que falta e o build da imagem, nao a porta.
            #   Exige a imagem declarar usuario nao-root (`USER 10001` no
            #   Dockerfile mais `COPY --chown` para o DATA_DIR); sem isso o
            #   kubelet recusa o pod. Foi implementado e verificado (build,
            #   uid 10001, escrita em DATA_DIR/bq_dlq, hurl 100%) e revertido
            #   em 5cc0c76, junto da mudanca de porta que na epoca parecia
            #   obrigatoria.
            #
            #   A porta deixou de ser bloqueio: o `capabilities.add` acima
            #   devolve o bind em 80 para qualquer uid, entao retomar o
            #   nao-root nao obriga mais a sair da porta 80 nem a coordenar
            #   com o `mcp-ilb` do iac-superapp (`modules/deployments/mcp.tf`,
            #   `target_port = 80` fixo, selecionando estes pods direto, sem
            #   passar pelo Service).
            # readOnlyRootFilesystem: true
            #   NÃO aplicar como está: o app escreve em DATA_DIR/bq_dlq/ e o
            #   `JsonBackend` faz mkdir + write. Exigiria montar um emptyDir
            #   nesses caminhos primeiro.
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1536Mi"
          # Cobre a inicialização, que carrega langgraph/geopandas/pandas e
          # roda o preflight de configuração. Enquanto não passar, liveness e
          # readiness ficam suspensos: um boot lento deixa de ser confundido
          # com um processo travado.
          startupProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30  # até 150s para subir
          # Liveness aponta para o endpoint trivial de propósito: ele não
          # consulta dependência alguma. Se checasse Redis ou BigQuery, uma
          # queda dessas dependências faria o kubelet matar o pod.
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # Readiness reflete "inicialização concluída" — também sem depender
          # de serviços externos. O estado das dependências fica em
          # /health/detail, que nunca retorna 503. Apontar para uma rota
          # própria desacopla as duas semânticas: verificações acrescentadas
          # ao readiness no futuro não poderão matar o pod.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      # Orçamento de encerramento, explícito porque o flush do buffer de escrita
      # do BigQuery depende dele. Em SIGTERM, `src/utils/bigquery.py` drena o
      # buffer de forma síncrona com teto de BIGQUERY_SHUTDOWN_TIMEOUT_SECONDS
      # (5s) por chamada de insert, uma por tabela em buffer. Estourar este
      # prazo significa SIGKILL no meio do flush — e aí não sobra nem a DLQ,
      # que é justamente a rede que o CHATR-103 construiu.
      #
      # 60s dá folga sobre o pior caso observável (4 tabelas x 5s = 20s) sem
      # atrasar rollout de forma perceptível: o pod sai assim que termina, o
      # valor é teto e não espera.
      terminationGracePeriodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-preview
spec:
  selector:
    app: mcp
  sessionAffinity: ClientIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
